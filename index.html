<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1f">
<title>Kickoff Lab · Soccer Match Simulator</title>
<meta name="description" content="Simulate real soccer fixtures 10,000 times with real line-ups, tactics and season data. No ads.">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand" id="brand"><div class="logo">⚽</div><div>Kickoff Lab<small>Match simulator · times in ET</small></div></div>
    <nav>
      <button class="navbtn" data-nav="fixtures">📅 <span>Fixtures</span></button>
      <button class="navbtn" data-nav="compare">⚖️ <span>Compare</span> <b id="cmpCount"></b></button>
      <button class="navbtn" data-nav="about">ℹ️ <span>How it works</span></button>
    </nav>
  </header>
  <div id="status" class="row xs mut" style="margin:-4px 2px 10px"></div>
  <main id="view"></main>
  <div class="disc">Simulations are statistical estimates, not guarantees. Kickoff Lab shows analysis only: no ads, no betting links.
    "Model fair odds" are simply 1 ÷ probability. Data: ESPN public feeds (fixtures, standings, line-ups, squad stats).</div>
</div>
<div class="toast" id="toast"></div>
<script src="js/engine.js"></script>
<script src="js/espn.js"></script>
<script src="js/app.js"></script>
</body>
</html>
